name: Проверка IT-вакансий
 
on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут
  workflow_dispatch:          # кнопка ручного запуска
 
permissions:
  contents: write
 
concurrency:
  group: vacancy-check
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
 
      - run: pip install -r requirements.txt
 
      - name: Проверить сайт и отправить новые вакансии
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check.py
 
      - name: Сохранить список уже отправленных вакансий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновлён список вакансий"
            git pull --rebase
            git push
          fi
 
